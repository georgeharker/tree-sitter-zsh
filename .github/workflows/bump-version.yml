name: Bump version

# Actions > Bump version > Run workflow (from main). Runs CI on main, bumps
# the version everywhere (tree-sitter version, lockfiles, CMake), commits
# "release: X", tags vX, and starts the release and publish workflows on the
# tag. A version with a suffix (0.65.0-dev.1) gets a GitHub prerelease only.
#
# A tag pushed with GITHUB_TOKEN doesn't trigger the tag-push workflows, but a
# workflow_dispatch sent with it does, so those are dispatched on the tag.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part to bump (ignored when a version is given)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version instead, e.g. 0.65.0-dev.1 (optional)
        type: string
        required: false

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  bump:
    name: Bump, tag and release
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the release commit and tag
      actions: write # dispatch the release and publish workflows
    env:
      GH_TOKEN: ${{github.token}}
      BUMP: ${{inputs.bump}}
      VERSION: ${{inputs.version}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Pushes the release commit and tag.
          persist-credentials: true
      - name: Set up NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@faab9a23fa6195da0f1cf868219cc1e89f238d3d # v2
      - name: Bump version
        run: |-
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ -n $VERSION ]]; then
            [[ $VERSION =~ $semver ]] || {
              echo "::error::not a version: $VERSION"; exit 1; }
            tree-sitter version "$VERSION"
          else
            tree-sitter version --bump "$BUMP"
          fi
          new=$(jq -r .metadata.version tree-sitter.json)
          [[ $new =~ $semver ]] || {
            echo "::error::unexpected version: $new"; exit 1; }
          if git ls-remote --exit-code origin "refs/tags/v$new" >/dev/null
          then
            echo "::error::tag v$new already exists"; exit 1
          fi
          # CMake's project(VERSION) takes no prerelease suffix.
          sed -i -E 's/^( +VERSION ")([0-9]+\.[0-9]+\.[0-9]+)-[^"]*"/\1\2"/' \
            CMakeLists.txt
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cargo update --workspace
          git diff --stat
          printf 'NEW=%s\n' "$new" >> "$GITHUB_ENV"
      - name: Commit and tag
        run: |-
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qam "release: $NEW"
          git tag -a "v$NEW" -m "tree-sitter-zsh $NEW"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$NEW"
      - name: Start release and publish
        run: |-
          gh workflow run release.yml --ref "v$NEW"
          if [[ $NEW == *-* ]]; then
            note='prerelease: GitHub release only, no registry publish'
          else
            gh workflow run publish.yml --ref "v$NEW"
            note='GitHub release, then npm, crates.io and PyPI'
          fi
          {
            printf '### v%s tagged\n\n' "$NEW"
            printf '%s. See the Create release and Publish package runs.\n' \
              "$note"
          } >> "$GITHUB_STEP_SUMMARY"
