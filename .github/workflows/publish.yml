name: Publish package

permissions:
  contents: read

on:
  push:
    # Not prerelease tags (v0.64.0-dev.1): those get a GitHub prerelease only.
    tags: ["*", "!*-*"]
  # Dispatched on the new tag by bump-version.yml.
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  npm:
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    permissions:
      contents: read
      id-token: write # trusted publishing / provenance
    # Local copy of the upstream package-npm.yml (see publish-npm.yml). Builds
    # Wasm with `npm x -- tree-sitter`, i.e. the tree-sitter-cli in
    # package.json; keep it >= 0.27 (wasi-sdk 34) for the Wasm memory fix.
    uses: ./.github/workflows/publish-npm.yml
    with:
      publish: true
    secrets:
      NPM_TOKEN: ${{secrets.NPM_TOKEN}}
  crates:
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    permissions:
      contents: read
      id-token: write # trusted publishing / provenance
    uses: tree-sitter/workflows/.github/workflows/package-crates.yml@d66eebce6bd661badf0ce10f1ce8f90ea8a89279 # main
    secrets:
      CARGO_REGISTRY_TOKEN: ${{secrets.CARGO_TOKEN}}
  pypi:
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    permissions:
      contents: read
      id-token: write # trusted publishing / provenance
    uses: tree-sitter/workflows/.github/workflows/package-pypi.yml@d66eebce6bd661badf0ce10f1ce8f90ea8a89279 # main
    secrets:
      PYPI_API_TOKEN: ${{secrets.PYPI_TOKEN}}
  # maven:
