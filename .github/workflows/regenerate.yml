name: Regenerate parser

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  regenerate:
    uses: tree-sitter/workflows/.github/workflows/regenerate.yml@d66eebce6bd661badf0ce10f1ce8f90ea8a89279 # main
    if: github.actor == 'dependabot[bot]'
