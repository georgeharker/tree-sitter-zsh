name: Regenerate parser

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  regenerate:
    uses: tree-sitter/workflows/.github/workflows/regenerate.yml@dca539e07998ac429e185349d3dd194d2c7418d3 # main
    if: github.actor == 'dependabot[bot]'
