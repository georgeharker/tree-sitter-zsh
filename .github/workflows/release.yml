name: Create release

on:
  push:
    tags: ["*"]
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    # Only tags: the upstream job names the release after the ref.
    if: github.ref_type == 'tag'
    # tree-sitter 0.27's wasi-sdk fixed the Wasm build's memory use, so the
    # upstream workflow works without the swap workaround.
    uses: tree-sitter/workflows/.github/workflows/release.yml@d66eebce6bd661badf0ce10f1ce8f90ea8a89279 # main
  prerelease:
    name: Mark as prerelease
    needs: release
    # A version with a suffix (v0.65.0-dev.1); upstream doesn't set the flag.
    if: contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Mark the release as a prerelease, not latest
        run: |-
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --prerelease --latest=false
        env:
          GH_TOKEN: ${{github.token}}
