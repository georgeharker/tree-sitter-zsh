name: Create release

on:
  push:
    tags: ["*"]
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    # Local copy with swap workaround for Wasm OOM. To revert to upstream once
    # the Wasm compiler is less memory-hungry, replace the uses line with:
    #   uses: tree-sitter/workflows/.github/workflows/release.yml@main
    uses: ./.github/workflows/release-local.yml
